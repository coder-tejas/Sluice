# LOCAL DEVELOPMENT ONLY. Not production architecture.
# Local stand-ins map to AWS managed services in production:
#   PostgreSQL -> RDS        |  Redis -> ElastiCache
#   MinIO      -> S3         |  (SQS / EKS have no local equivalent here)
services:
  # -> RDS in production
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: Sluice
      POSTGRES_PASSWORD: Sluice
      POSTGRES_DB: Sluice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # -> ElastiCache (Redis) in production
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # -> S3 in production (S3-compatible object storage for local dev)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  pgdata:
  miniodata:
