# LOCAL DEVELOPMENT ONLY. Not production architecture.
# Local stand-ins map to AWS managed services in production:
#   PostgreSQL -> RDS        |  Redis -> ElastiCache
#   MinIO      -> S3         |  (SQS / EKS have no local equivalent here)
services:
  # -> RDS in production
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: Sluice
      POSTGRES_PASSWORD: Sluice
      POSTGRES_DB: Sluice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Sluice -d Sluice"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Control-plane API. Needs SLUICE_DATABASE_URL at runtime; schema changes
  # go through Alembic (apps/api/alembic), never create_all at startup.
  api:
    build: ./apps/api
    environment:
      SLUICE_ENVIRONMENT: development
      SLUICE_LOG_LEVEL: INFO
      SLUICE_DATABASE_URL: postgresql://Sluice:Sluice@postgres:5432/Sluice
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # OpenAI-compatible gateway (data plane). No database dependency.
  router:
    build: ./apps/router
    environment:
      SLUICE_WORKER_URL: http://llama-server:8080
      SLUICE_MODEL_ID: qwen2.5-0.5b-instruct
      SLUICE_UPSTREAM_TIMEOUT: "300"
    ports:
      - "8001:8001"
    depends_on:
      llama-server:
        condition: service_healthy

  # P0 inference worker: real llama.cpp, model baked into the image.
  llama-server:
    build: ./docker/llama
    ports:
      - "8080:8080"
    healthcheck:
      # 503 while loading the model, 200 when ready.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  # -> ElastiCache (Redis) in production
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # -> S3 in production (S3-compatible object storage for local dev)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  pgdata:
  miniodata:
