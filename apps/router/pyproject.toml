[project]
name = "sluice-router"
version = "0.1.0"
description = "OpenAI-compatible gateway for Sluice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27", "openai>=1.40"]
dev = ["sluice-router[test]", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sluice_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88