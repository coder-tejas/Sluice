# Scaffold Deployment + Service for the API (not implemented yet).
{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "Sluice.fullname" . }}-api
  labels:
    {{- include "Sluice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "Sluice.fullname" . }}-api
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: 8000
{{- end }}
