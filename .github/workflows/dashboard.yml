name: dashboard
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Future: pnpm install, tsc, next build.
      - run: node -e "for (const f of ['package.json','apps/dashboard/package.json','packages/typescript/sdk/package.json','packages/typescript/types/package.json','packages/typescript/ui/package.json']) JSON.parse(require('fs').readFileSync(f)); console.log('package.json files valid')"
